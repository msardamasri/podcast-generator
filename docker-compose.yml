services:
  postgres:
    image: postgres:16-alpine
    container_name: podcast-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-podcast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-podcast_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-podcast}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcast -d podcast"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: podcast-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: run migrations before api/worker startmigrate:
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: podcast-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://podcast:podcast_dev_password@postgres:5432/podcast
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    command: alembic upgrade head
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: podcast-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://podcast:podcast_dev_password@postgres:5432/podcast
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      APP_ENV: development
      LOG_LEVEL: INFO
      AUDIO_STORAGE_PATH: /data/audio
    ports:
      - "8000:8000"
    volumes:
      # Hot reload: mount source code, override the COPY from the image
      - ./apps/backend/app:/app/apps/backend/app
      - ./packages/pipeline/pipeline:/app/packages/pipeline/pipeline
      # Persistent audio storage
      - audio_data:/data/audio
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: podcast-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://podcast:podcast_dev_password@postgres:5432/podcast
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      APP_ENV: development
      LOG_LEVEL: INFO
      AUDIO_STORAGE_PATH: /data/audio
    volumes:
      - ./apps/backend/app:/app/apps/backend/app
      - ./packages/pipeline/pipeline:/app/packages/pipeline/pipeline
      - audio_data:/data/audio
    # On Linux containers we use the prefork pool (default), not 'solo'
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2

  beat:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: podcast-beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://podcast:podcast_dev_password@postgres:5432/podcast
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      APP_ENV: development
      LOG_LEVEL: INFO
      AUDIO_STORAGE_PATH: /data/audio
    volumes:
      - ./apps/backend/app:/app/apps/backend/app
      - ./packages/pipeline/pipeline:/app/packages/pipeline/pipeline
      - audio_data:/data/audio
    command: celery -A app.worker.celery_app beat --loglevel=info

  frontend:
      build:
        context: .
        dockerfile: apps/frontend/Dockerfile
      container_name: podcast-frontend
      depends_on:
        - api
      ports:
        - "5173:5173"
      volumes:
        - ./apps/frontend/src:/app/src
        - ./apps/frontend/index.html:/app/index.html
        - ./apps/frontend/vite.config.ts:/app/vite.config.ts
        - ./apps/frontend/tailwind.config.js:/app/tailwind.config.js
        - ./apps/frontend/postcss.config.js:/app/postcss.config.js
        - ./apps/frontend/tsconfig.json:/app/tsconfig.json
      environment:
        CHOKIDAR_USEPOLLING: "true"
  
volumes:
  postgres_data:
  audio_data: