[project]
name = "pipeline"
version = "0.1.0"
description = "Personal podcast generation pipeline"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "elevenlabs>=1.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "pydub>=0.25.1",
    "audioop-lts ; python_version >= '3.13'"
    "tenacity>=8.5.0",
    "trafilatura>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"